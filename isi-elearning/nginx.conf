server {
    # nginx-unprivileged écoute par défaut sur 8080 (port >1024 accessible à un utilisateur non-root)
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Application Angular en mode SPA : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers statiques buildés avec hash -> cache long
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # Utilisé par le HEALTHCHECK du Dockerfile
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
