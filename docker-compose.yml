services:
  mysql:
    image: mysql:8.0
    container_name: elearning-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # Volume nommé -> les données survivent à un `docker compose down` / restart
      - mysql_data:/var/lib/mysql
      # Schéma exécuté automatiquement au tout premier démarrage (dossier vide)
      - ./backend-elearning/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - elearning-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ./backend-elearning
    container_name: elearning-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        # attend que le healthcheck MySQL passe au vert, pas juste que le conteneur démarre
        condition: service_healthy
    networks:
      - elearning-net

  frontend:
    build:
      context: ./isi-elearning
    container_name: elearning-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:8080"
    depends_on:
      - api
    networks:
      - elearning-net

networks:
  # Réseau bridge dédié (pas le "bridge" par défaut) : seuls ces 3 services
  # se voient entre eux, résolution DNS par nom de service (mysql, api, frontend)
  elearning-net:
    driver: bridge

volumes:
  mysql_data:
  uploads_data:
