apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: elearning
  labels:
    app: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # 1 Pod supplémentaire peut être créé pendant la mise à jour
      maxUnavailable: 0  # jamais moins de 2 Pods disponibles -> zéro coupure
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # ⚠️ remplacer par l'image poussée sur Docker Hub (Partie 1), ex: monuser/elearning-api:v1
          image: ndoumbe234/elearning-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: elearning-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: elearning-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elearning-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: elearning-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
