# Données sensibles : identifiants MySQL + secret JWT.
# ⚠️ Ce sont des valeurs de démo pour Minikube en local. Ne jamais réutiliser
# ces valeurs telles quelles dans un vrai environnement, et ne pas committer
# un Secret contenant de vrais secrets de production dans un dépôt public.
apiVersion: v1
kind: Secret
metadata:
  name: elearning-secret
  namespace: elearning
type: Opaque
stringData:
  DB_USER: "elearning_user"
  DB_PASSWORD: "changeme_user_password"
  MYSQL_ROOT_PASSWORD: "changeme_root_password"
  JWT_SECRET: "changeme_long_random_jwt_secret"
